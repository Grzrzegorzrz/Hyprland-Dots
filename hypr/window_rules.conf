windowrule {
  name = windowrule-1
  no_blur = 0
  match:class = ^(wayland)$
}

windowrule {
  name = windowrule-2
  float = on
  move = (cursor_x-(window_w*1)) (cursor_y-(window_h*1))
  match:class = ^(feh)$
}

windowrule {
  name = windowrule-3
  float = on
  size = (monitor_w*0.17) (monitor_h*0.4)
  match:class = ^(org.kde.kalk)$
}

windowrule {
  name = windowrule-4
  float = on
  match:class = ^(qalculate-gtk)$
}

windowrule {
  name = windowrule-5
  no_anim = on
  match:class = ^(flameshot)$
}

windowrule {
  name = windowrule-6
  move = (0) (0)
  float = on
  # fullscreen_state = on
  match:class = (flameshot)
  match:title = (flameshot)
}

windowrule {
  name = windowrule-7
  float = on
  size = (monitor_w*0.6) (monitor_h*0.65)
  match:class = ^(foot)$
  match:title = ^(terminal filechooser)$
}


windowrule {
  name = windowrule-8
  workspace = special:discord
  match:class = ^($discord)$
}

windowrule {
  name = windowrule-9
  workspace = special:top
  match:class = ^($terminal)$
  match:title = ^($top)$
}


windowrule {
  name = windowrule-10
  suppress_event = maximize
  match:class = .* # You'll probably like this.
}


workspace = special:email, on-created-empty:$email
workspace = special:discord, on-created-empty:$discord
workspace = special:spotify, on-created-empty:$spotify
workspace = special:top, on-created-empty:$top
workspace = special:terminal, on-created-empty:[float]$terminal

# dynamically added float rules
windowrule {
  name = windowrule-11
  float = on
  match:class = ^(zen)$
  match:initial_title = ^(Parent process Browser Console)$
}

windowrule {
  name = windowrule-12
  float = on
  match:class = ^(zen)$
  match:initial_title = ^(Library)$
}

windowrule {
  name = windowrule-13
  float = on
  match:class = ^(zen)$
  match:initial_title = ^(Picture-in-Picture)$
}

windowrule {
  name = windowrule-14
  float = on
  match:class = ^(zen)$
  match:initial_title = ^()$
}

windowrule {
  name = windowrule-15
  float = on
  match:class = ^(flameshot)$
  match:initial_title = ^(Configuration)$
}

windowrule {
  name = windowrule-16
  float = on
  match:class = ^(flameshot)$
  match:initial_title = ^(flameshot-pin)$
}
