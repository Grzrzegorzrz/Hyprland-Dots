################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

monitor=,preferred,auto,auto

#################
### VARIABLES ###
#################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
$vscode = vscodium
$browser = zen-browser
$discord = vesktop
$spotify = spotify
$fileManager = $terminal -e yazi
$scripts = ~/.config/hypr/scripts

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = waybar
exec-once = hyprpaper 
exec-once = hypridle
# exec-once = /usr/bin/easyeffects --gapplication-service
exec-once = udiskie
exec-once = xremap ~/.config/xremap/xonfig.yml
exec-once = fcitx5
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = kanshi
exec-once = rm -r ~/Pictures/float_images/*

 
# bind=,code:124,exec, systemctl suspend; hyprlock

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

#env = QT_QPA_PLATFORM,wayland
#env = QT_QPA_PLATFORMTHEME,qt6ct
#env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
#env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = QT_STYLE_OVERRIDE,kvantum

env = XDG_CURRENT_DESKTOP,Hyprland

env = ADW_DISABLE_PORTAL,1
env = GTK_THEME,Orchis-Grey-Dark

#exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME

exec = gsettings set org.gnome.desktop.interface gtk-theme "breeze-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 4

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(ffffffee) 45deg
    col.inactive_border = rgba(909090aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_strength = 0.2

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, default
    animation = specialWorkspace, 1, 2, myBezier, fade
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#master {
#    new_is_master = true
#}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

xwayland {
     force_zero_scaling = true
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us, us, us
    kb_variant = , colemak_dh_ortho, colemak_dh
    kb_options = grp:win_space_toggle#, ctrl:nocaps
    kb_rules =

    follow_mouse = 1
    numlock_by_default = false

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        middle_button_emulation = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
    workspace_swipe_touch = true
    workspace_swipe_cancel_ratio = 0.03
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
    inactive_timeout = 0.2
    min_refresh_rate = 60
}

####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mod = SUPER # Sets "Windows" key as main modifier

# See https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, $mod_L, exec, pkill rofi || rofi -show drun
bind = $mod, F, exec, pkill rofi || rofi -show window
bind = $mod, R, exec, pkill rofi || rofi -show recursivebrowser
bind = $mod, Q, killactive,

# Window modifiers
bind = CTRL+ALT, F, togglefloating,
bind = $mod, O, togglesplit, # dwindle
# bind = $mod, P, pseudo, # dwindle

# Screenshot to clipboard, display, then region
bind = $mod, S, exec, hyprshot -m output --clipboard-only
bind = ALT, S, exec, hyprshot -m region --clipboard-only

# Screenshot to file, display, then region
bind = $mod+SHIFT, S, exec, hyprshot -m output
bind = ALT+SHIFT, S, exec, hyprshot -m region

# Screenshot then float it
bind = CTRL+ALT, S, exec, $scripts/dynamic_floats.sh

bind = $mod, A, fullscreen

bind = CTRL+ALT, Slash, exec, $terminal
bind = CTRL+ALT, Semicolon, exec, $fileManager
bind = CTRL+ALT+Shift, Semicolon, exec, kitty -e yazi
bind = CTRL+ALT, N, exec, $terminal -e nvim
bind = CTRL+ALT, B, exec, $browser
bind = CTRL+ALT, V, exec, $vscode
bind = CTRL+ALT, T, exec, $terminal -e btop
bind = CTRL+ALT, W, exec, killall -SIGUSR1 waybar || waybar
bind = CTRL+ALT, C, exec, kalk
bind = , XF86Calculator, exec, kalk

bind = CTRL+ALT, Return, exec, $scripts/border_mode.sh

# Window resizing
binde = CTRL, right, resizeactive, 200 0
binde = CTRL, left, resizeactive, -200 0
binde = CTRL, up, resizeactive, 0 -200
binde = CTRL, down, resizeactive, 0 200

binde = CTRL+SHIFT, right, resizeactive, 80 0
binde = CTRL+SHIFT, left, resizeactive, -80 0
binde = CTRL+SHIFT, up, resizeactive, 0 -80
binde = CTRL+SHIFT, down, resizeactive, 0 80

# binde = SHIFT+ALT, right, resizeactive, 10 0
# binde = SHIFT+ALT, left, resizeactive, -10 0
# binde = SHIFT+ALT, up, resizeactive, 0 -10
# binde = SHIFT+ALT, down, resizeactive, 0 10

# bind = $mod, code:119, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next # change between colemak dh and qwerty

# Audio
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

binde = CTRL, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%+
binde = CTRL, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%-
bind = CTRL, XF86AudioMute, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 140%-

# Mic
bind =,XF86AudioMicMute,exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = CTRL+ALT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SOURCE@ 5%+
binde = CTRL+ALT, XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SOURCE@ 5%-

# Brightness
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set 5%+

bind=CTRL,XF86MonBrightnessDown,exec,brightnessctl set 1%-
bind=CTRL,XF86MonBrightnessUp,exec,brightnessctl set 1%+

# Zoom
binde = ALT, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = ALT, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
binde = ALT, KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = ALT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

bind = CTRL+ALT, minus, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = CTRL+ALT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = ALT, 0, exec, hyprctl -q keyword cursor:zoom_factor 1

# Switch workspaces with ALT + CTRL + [0-9]
bind = CTRL+ALT, 1, workspace, 1
bind = CTRL+ALT, 2, workspace, 2
bind = CTRL+ALT, 3, workspace, 3
bind = CTRL+ALT, 4, workspace, 4
bind = CTRL+ALT, 5, workspace, 5
bind = CTRL+ALT, 6, workspace, 6
bind = CTRL+ALT, 7, workspace, 7
bind = CTRL+ALT, 8, workspace, 8
bind = CTRL+ALT, 9, workspace, 9
bind = CTRL+ALT, 0, workspace, 10

# Move active window to a workspace with mod + CTRL + [0-9]
bind = $mod+CTRL, 1, movetoworkspace, 1
bind = $mod+CTRL, 2, movetoworkspace, 2
bind = $mod+CTRL, 3, movetoworkspace, 3
bind = $mod+CTRL, 4, movetoworkspace, 4
bind = $mod+CTRL, 5, movetoworkspace, 5
bind = $mod+CTRL, 6, movetoworkspace, 6
bind = $mod+CTRL, 7, movetoworkspace, 7
bind = $mod+CTRL, 8, movetoworkspace, 8
bind = $mod+CTRL, 9, movetoworkspace, 9
bind = $mod+CTRL, 0, movetoworkspace, 10

# Primary special workspace
bind = CTRL+ALT, E, togglespecialworkspace, e
bind = $mod, E, exec, $scripts/special_workspace_move.sh -e
bind = $mod+CTRL, E, exec, $scripts/special_workspace_move.sh -e

# Secondary special workspace
bind = CTRL+ALT, I, togglespecialworkspace, special
bind = $mod, I, exec, $scripts/special_workspace_move.sh
bind = $mod+CTRL, I, exec, $scripts/special_workspace_move.sh

# Discord workspace
bind = CTRL+ALT, D, togglespecialworkspace, discord
bind = $mod, D, exec, $scripts/special_workspace_move.sh -d
bind = $mod+CTRL, D, exec, $scripts/special_workspace_move.sh -d

# Betterbird workspace
bind = CTRL+ALT, U, togglespecialworkspace, thunderbird
bind = $mod, U, exec, $scripts/special_workspace_move.sh -t
bind = $mod+CTRL, U, exec, $scripts/special_workspace_move.sh -t

# Spotify workspace
bind = CTRL+ALT, M, togglespecialworkspace, spotify
bind = $mod, M, exec, $scripts/special_workspace_move.sh -s
bind = $mod+CTRL, M, exec, $scripts/special_workspace_move.sh -s

# Betterbird workspace
bind = CTRL+ALT, A, togglespecialworkspace, slack

# Move windows
bind = $mod, H, movewindow, l
bind = $mod, L, movewindow, r
bind = $mod, K, movewindow, u
bind = $mod, J, movewindow, d

# Move through workspaces
bind = CTRL+ALT, l, workspace, r+1
bind = CTRL+ALT, h, workspace, r-1
bind = CTRL+ALT, j, togglespecialworkspace, vertical
bind = CTRL+ALT, k, togglespecialworkspace, vertical 

# Exits out of special workspace
bind = CTRL+ALT, space, togglespecialworkspace, void
bind = CTRL+ALT, space, togglespecialworkspace, void

bind = CTRL+ALT, Apostrophe, togglespecialworkspace, void
bind = CTRL+ALT, Apostrophe, togglespecialworkspace, void

# Move windows to other workspaces
bind = $mod+CTRL, l, movetoworkspace, r+1
bind = $mod+CTRL, h, movetoworkspace, r-1
bind = $mod+CTRL, j, exec, $scripts/special_workspace_move.sh -v
bind = $mod+CTRL, k, exec, $scripts/special_workspace_move.sh -v

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, resizewindow
bindm = $mod+CTRL, mouse:272, movewindow

# Cycle windows
bind = ALT,Tab,cyclenext
bind = ALT_SHIFT,Tab,cyclenext,prev

# Window focus
bind = ALT, h, movefocus, l
bind = ALT, l, movefocus, r
bind = ALT, k, movefocus, u
bind = ALT, j, movefocus, d

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrulev2 = noblur 0, class:^(wayland)$
windowrulev2 = float, class:^(feh)$
windowrulev2 = move onscreen cursor -100% -100%, class:^(feh)$
windowrulev2 = float, class:^(org.kde.kalk)$
windowrulev2 = float, class:^(qalculate-gtk)$

windowrulev2 = float, class:^(foot)$,title:^(terminal filechooser)$
windowrulev2 = size 60% 65%, class:^(foot)$,title:^(terminal filechooser)$

windowrulev2 = float, class:^(zen)$,title:^(Parent process Browser Console)$
windowrulev2 = float, class:^(zen)$,title:^(Library)$
windowrulev2 = float, class:^(zen)$,title:^(Picture-in-Picture)$

windowrulev2 = workspace special:discord, class:^($discord)$

#windowrulev2 = float,class:^(MuPDF)$,title:^(MuPDF)$
#windowrulev2 = float, onworkspace:s[true]
#windowrulev2 = float, onworkspace:special:thunderbird[false]
#windowrulev2 = float, onworkspace:special:discord[false]
#windowrulev2 = float, onworkspace:special:spotify[false]

windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

workspace = special:thunderbird, on-created-empty:betterbird
workspace = special:discord, on-created-empty:$discord
workspace = special:spotify, on-created-empty:spotify
