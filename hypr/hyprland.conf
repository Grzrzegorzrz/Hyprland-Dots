# default applications
$calculator = kalk
$terminal = foot
$browser = zen-browser
$discord = vesktop
$spotify = spotify
$email = outlook-for-linux
$top = $terminal -e btop
$fileManager = $terminal -e yazi

# directories
$scripts = $HOME/.config/hypr/scripts

source = $HOME/.config/hypr/hypr_keybinds.conf
source = $HOME/.config/hypr/window_rules.conf

################
### MONITORS ###
################

# monitor= DP-1, 2560x1440@239.97, 1536x0, 1, bitdepth, 10, cm, hdr, vrr, 1
monitor= DP-6, 2560x1440@239.97, 1200x0, 1, bitdepth, 10, cm, srgb, vrr, 0
monitor=,preferred,auto,auto

#################
### AUTOSTART ###
#################

# exec-once = $terminal
exec-once = hyprpaper
exec-once = hypridle
# exec-once = /usr/bin/easyeffects --gapplication-service
exec-once = udiskie
exec-once = fcitx5
# exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = systemctl --user start hyprpolkitagent
exec-once = kanshi
exec-once = sddm
exec-once = sleep 1; xremap $HOME/.config/xremap/xonfig.yml
exec-once = sleep 1; $scripts/waybar.sh

# exec-once = rm -r $HOME/Pictures/.float_images/*
exec-once = $scripts/dynamic_floats.sh leftover
exec-once = rm -r $scripts/vertical_temp

# bind=,code:124,exec, systemctl suspend; hyprlock

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = EDITOR,nvim
env = FILEMANAGER,/usr/local/share/xdg-desktop-portal-termfilechooser/yazi-wrapper.sh

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24

#env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
#env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
#env = QT_AUTO_SCREEN_SCALE_FACTOR,1
#env = QT_STYLE_OVERRIDE,kvantum

env = XDG_CURRENT_DESKTOP,Hyprland

env = ADW_DISABLE_PORTAL,1
env = GTK_THEME,Orchis-Grey-Dark

#exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP QT_QPA_PLATFORMTHEME

exec = gsettings set org.gnome.desktop.interface gtk-theme "breeze-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

#################
### VARIABLES ###
#################

general {
    gaps_in = -1
    gaps_out = 6

    border_size = 3

    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = rgba(ffffffee) 45deg
    col.inactive_border = rgba(90909088)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    dim_strength = 0.2

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.03, 1, 0.05, 1.0

    animation = windows, 1, 7, myBezier, popin 80%
    animation = windowsOut, 1, 3, default, popin 80%
    animation = windowsMove, 1, 5, myBezier, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 3, default
    animation = specialWorkspace, 1, 2, myBezier, fade
    animation = zoomFactor, 0, 0, myBezier
}

dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
    preserve_split = true # You probably want this
}

#master {
#    new_is_master = true
#}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

xwayland {
     force_zero_scaling = true
}

input {
    kb_layout = us, us, us
    kb_variant = , colemak_dh_ortho, colemak_dh
    kb_options = grp:win_space_toggle#, ctrl:nocaps
    kb_rules =

    repeat_rate = 35
    repeat_delay = 250

    follow_mouse = 1
    numlock_by_default = false

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        middle_button_emulation = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_touch = true
    workspace_swipe_cancel_ratio = 0.03
}

# Example per-device config
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

cursor {
    inactive_timeout = 0.2
    min_refresh_rate = 60
}
