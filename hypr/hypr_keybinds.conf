$mod = SUPER # gui/windows/command key

# rofi
bind = $mod, $mod_L, exec, pkill rofi || rofi -show drun -drun-display-format "{name}"
bind = $mod, F, exec, pkill rofi || rofi -show window
bind = $mod, R, exec, pkill rofi || rofi -show recursivebrowser

# Window modifiers
bind = $mod, A, fullscreen
bind = $mod, Q, killactive,
bind = $mod, O, togglesplit,
# bind = $mod, P, pseudo, # dwindle
bind = CTRL+ALT, F, exec, $scripts/float_resize.sh

# Screenshot to clipboard, display, then region
bind = ALT, S, exec, flameshot gui
bind = $mod, S, exec, grim - | wl-copy  # idk if this works for multi monitors
bind = $mod+SHIFT, S, exec, grim  # idk if this works for multi monitors

# Screenshot then float it
bind = CTRL+ALT, S, exec, $scripts/dynamic_floats.sh

# Applications
bind = CTRL+ALT, Semicolon, exec, $terminal
bind = CTRL+ALT, Slash, exec, $fileManager
bind = CTRL+ALT, N, exec, kitty -e nvim # for nvim image support
bind = CTRL+ALT, B, exec, $browser
bind = CTRL+ALT, W, exec, killall -SIGUSR1 waybar || waybar
bind = CTRL+ALT, C, exec, $calculator
bind = , XF86Calculator, exec, $calculator

bind = CTRL+ALT, Return, exec, $scripts/border_mode.sh

# Window resizing
binde = CTRL, right, resizeactive, 200 0
binde = CTRL, left, resizeactive, -200 0
binde = CTRL, up, resizeactive, 0 -200
binde = CTRL, down, resizeactive, 0 200

binde = CTRL+SHIFT, right, resizeactive, 80 0
binde = CTRL+SHIFT, left, resizeactive, -80 0
binde = CTRL+SHIFT, up, resizeactive, 0 -80
binde = CTRL+SHIFT, down, resizeactive, 0 80

# binde = SHIFT+ALT, right, resizeactive, 10 0
# binde = SHIFT+ALT, left, resizeactive, -10 0
# binde = SHIFT+ALT, up, resizeactive, 0 -10
# binde = SHIFT+ALT, down, resizeactive, 0 10

# bind = $mod, code:119, exec, hyprctl switchxkblayout at-translated-set-2-keyboard next # change between colemak dh and qwerty

# Audio
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

binde = CTRL, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%+
binde = CTRL, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 1%-
bind = CTRL, XF86AudioMute, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 140%-

# Mic
bind =,XF86AudioMicMute,exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde = CTRL+ALT, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SOURCE@ 5%+
binde = CTRL+ALT, XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SOURCE@ 5%-

# Brightness
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86MonBrightnessUp,exec,brightnessctl set 5%+

bind=CTRL,XF86MonBrightnessDown,exec,brightnessctl set 1%-
bind=CTRL,XF86MonBrightnessUp,exec,brightnessctl set 1%+

# Zoom
binde = ALT, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = ALT, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
binde = ALT, KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = ALT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

bind = CTRL+ALT, minus, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = CTRL+ALT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = ALT, 0, exec, hyprctl -q keyword cursor:zoom_factor 1

# change float rule
bind = CTRL+ALT, grave, exec, $scripts/add_floating_rule.sh
# bind = CTRL+ALT, asciitilde, exec, $scripts/remove_floating_rule.sh

# Switch workspaces
bind = CTRL+ALT, 1, workspace, 1
bind = CTRL+ALT, 2, workspace, 2
bind = CTRL+ALT, 3, workspace, 3
bind = CTRL+ALT, 4, workspace, 4
bind = CTRL+ALT, 5, workspace, 5
bind = CTRL+ALT, 6, workspace, 6
bind = CTRL+ALT, 7, workspace, 7
bind = CTRL+ALT, 8, workspace, 8
bind = CTRL+ALT, 9, workspace, 9
bind = CTRL+ALT, 0, workspace, 10

# Switch vertical workspaces
bind = CTRL+ALT+SHIFT, 1, workspace, special:vertical.1
bind = CTRL+ALT+SHIFT, 2, workspace, special:vertical.2
bind = CTRL+ALT+SHIFT, 3, workspace, special:vertical.3
bind = CTRL+ALT+SHIFT, 4, workspace, special:vertical.4
bind = CTRL+ALT+SHIFT, 5, workspace, special:vertical.5
bind = CTRL+ALT+SHIFT, 6, workspace, special:vertical.6
bind = CTRL+ALT+SHIFT, 7, workspace, special:vertical.7
bind = CTRL+ALT+SHIFT, 8, workspace, special:vertical.8
bind = CTRL+ALT+SHIFT, 9, workspace, special:vertical.9
bind = CTRL+ALT+SHIFT, 0, togglespecialworkspace, special:void
bind = CTRL+ALT+SHIFT, 0, togglespecialworkspace, special:void

# Move active window
bind = $mod+CTRL, 1, movetoworkspace, 1
bind = $mod+CTRL, 2, movetoworkspace, 2
bind = $mod+CTRL, 3, movetoworkspace, 3
bind = $mod+CTRL, 4, movetoworkspace, 4
bind = $mod+CTRL, 5, movetoworkspace, 5
bind = $mod+CTRL, 6, movetoworkspace, 6
bind = $mod+CTRL, 7, movetoworkspace, 7
bind = $mod+CTRL, 8, movetoworkspace, 8
bind = $mod+CTRL, 9, movetoworkspace, 9
bind = $mod+CTRL, 0, movetoworkspace, 10

# Move active window to vertical
bind = $mod+CTRL+SHIFT, 1, movetoworkspace, special:vertical.1
bind = $mod+CTRL+SHIFT, 2, movetoworkspace, special:vertical.2
bind = $mod+CTRL+SHIFT, 3, movetoworkspace, special:vertical.3
bind = $mod+CTRL+SHIFT, 4, movetoworkspace, special:vertical.4
bind = $mod+CTRL+SHIFT, 5, movetoworkspace, special:vertical.5
bind = $mod+CTRL+SHIFT, 6, movetoworkspace, special:vertical.6
bind = $mod+CTRL+SHIFT, 7, movetoworkspace, special:vertical.7
bind = $mod+CTRL+SHIFT, 8, movetoworkspace, special:vertical.8
bind = $mod+CTRL+SHIFT, 9, movetoworkspace, special:vertical.9
# HACK: use the move script
bind = $mod+CTRL+SHIFT, 0, movetoworkspace, r+1
bind = $mod+CTRL+SHIFT, 0, movetoworkspace, r-1

# Primary special workspace
bind = CTRL+ALT, E, togglespecialworkspace, e
bind = $mod, E, exec, $scripts/special_workspace_move.sh -e
bind = $mod+CTRL, E, exec, $scripts/special_workspace_move.sh -e

# Secondary special workspace
bind = CTRL+ALT, I, togglespecialworkspace, special
bind = $mod, I, exec, $scripts/special_workspace_move.sh
bind = $mod+CTRL, I, exec, $scripts/special_workspace_move.sh

# Discord workspace
bind = CTRL+ALT, D, togglespecialworkspace, discord
bind = $mod, D, exec, $scripts/special_workspace_move.sh -d
bind = $mod+CTRL, D, exec, $scripts/special_workspace_move.sh -d

# Email workspace
bind = CTRL+ALT, U, togglespecialworkspace, email
bind = $mod, U, exec, $scripts/special_workspace_move.sh -u
bind = $mod+CTRL, U, exec, $scripts/special_workspace_move.sh -u

# Spotify workspace
bind = CTRL+ALT, M, togglespecialworkspace, spotify
bind = $mod, M, exec, $scripts/special_workspace_move.sh -s
bind = $mod+CTRL, M, exec, $scripts/special_workspace_move.sh -s

# Slack workspace (not in use rn)
bind = CTRL+ALT, A, togglespecialworkspace, slack

# Top workspace
bind = CTRL+ALT, T, togglespecialworkspace, top
bind = $mod, T, exec, $scripts/special_workspace_move.sh -t
bind = $mod+CTRL, T, exec, $scripts/special_workspace_move.sh -t

# Misc workspace
bind = CTRL+ALT, period, togglespecialworkspace, background
bind = $mod, period, exec, $scripts/special_workspace_move.sh -g
bind = $mod+CTRL, period, exec, $scripts/special_workspace_move.sh -g

# Move windows
bind = $mod, H, movewindow, l
bind = $mod, L, movewindow, r
bind = $mod, K, movewindow, u
bind = $mod, J, movewindow, d

bind = $mod+SHIFT, H, movewindowpixel, -80 0, activewindow
bind = $mod+SHIFT, L, movewindowpixel, 80 0, activewindow
bind = $mod+SHIFT, K, movewindowpixel, 0 -80, activewindow
bind = $mod+SHIFT, J, movewindowpixel, 0 80, activewindow

bind = $mod+SHIFT, b, movewindowpixel, -300 0, activewindow
bind = $mod+SHIFT, f, movewindowpixel, 300 0, activewindow
bind = $mod+SHIFT, p, movewindowpixel, 0 -200, activewindow
bind = $mod+SHIFT, n, movewindowpixel, 0 200, activewindow

# Move through workspaces
bind = CTRL+ALT, l, workspace, r+1
bind = CTRL+ALT, h, workspace, r-1
bind = CTRL+ALT, j, exec, $scripts/vertical_workspaces.sh -1
bind = CTRL+ALT, k, exec, $scripts/vertical_workspaces.sh 1

# Exits out of special workspace
bind = CTRL+ALT, space, togglespecialworkspace, void
bind = CTRL+ALT, space, togglespecialworkspace, void
bind = CTRL+ALT+SHIFT, space, togglespecialworkspace, void
bind = CTRL+ALT+SHIFT, space, togglespecialworkspace, void

bind = CTRL+ALT, Apostrophe, togglespecialworkspace, void
bind = CTRL+ALT, Apostrophe, togglespecialworkspace, void

# Move windows to other workspaces
bind = $mod+CTRL, l, movetoworkspace, r+1
bind = $mod+CTRL, h, movetoworkspace, r-1
bind = $mod+CTRL, j, exec, $scripts/vertical_workspaces.sh --move -1
bind = $mod+CTRL, k, exec, $scripts/vertical_workspaces.sh --move 1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, resizewindow
bindm = $mod+CTRL, mouse:272, movewindow

# Cycle windows
bind = ALT,Tab,cyclenext
bind = ALT_SHIFT,Tab,cyclenext, prev

# Window focus
bind = ALT, h, movefocus, l
bind = ALT, l, movefocus, r
bind = ALT, k, movefocus, u
bind = ALT, j, movefocus, d
